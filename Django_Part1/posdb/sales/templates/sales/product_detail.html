<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
</head>
<body>

    <h2>{{ product.name }}</h2>

    <img src="{{ product.image.url }}" width="300">

    <p><b>Price:</b> ${{ product.price }}</p>

    <p><b>Description:</b> {{ product.description }}</p>

    <a href="{% url 'product_list' %}">⬅ Back</a>

</body>
</html>
